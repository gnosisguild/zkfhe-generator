[workspace]
resolver = "2"
members = [
    "crates/generator",
    "crates/shared",
    "crates/circuits/greco",
    "crates/circuits/pk_trbfv",
    "crates/circuits/dec_share_trbfv",
    "crates/circuits/dec_bfv",
    "crates/circuits/dec_bfv_no_hom_add",
    "crates/circuits/dec_share_agg_trbfv",
    "crates/crypto_params"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Gnosis Guild"]
license = "LGPL-3.0"
repository = "https://github.com/gnosisguild/zkfhe-toml-generator"
homepage = "https://github.com/gnosisguild/zkfhe-toml-generator"
readme = "README.md"
keywords = ["mathematics", "zero-knowledge-proof", "noir", "toml", "cryptography", "zkp"]
categories = ["mathematics", "cryptography", "science"]
rust-version = "1.86.0"

[workspace.dependencies]
greco = { package = "zkfhe-greco", path = "./crates/circuits/greco" }
pk_trbfv = { package = "zkfhe-pk-trbfv", path = "./crates/circuits/pk_trbfv" }
dec_share_trbfv = { package = "zkfhe-dec-share-trbfv", path = "./crates/circuits/dec_share_trbfv" }
dec_share_agg_trbfv = { package = "zkfhe-dec-share-agg-trbfv", path = "./crates/circuits/dec_share_agg_trbfv" }
dec_bfv = { package = "zkfhe-dec-bfv", path = "./crates/circuits/dec_bfv" }
dec_bfv_no_hom_add = { package = "zkfhe-dec-bfv-no-hom-add", path = "./crates/circuits/dec_bfv_no_hom_add" }
generator = { package = "zkfhe-generator", path = "./crates/generator" }
shared = { package = "zkfhe-shared", path = "./crates/shared" }
crypto_params = { package = "zkfhe-crypto-params", path = "./crates/crypto_params" }

# needs cleanup from previous generator.
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
fhe = { git = "https://github.com/gnosisguild/fhe.rs", branch = "raw-bytes" }
fhe-traits = { git = "https://github.com/gnosisguild/fhe.rs", branch = "raw-bytes" }
fhe-math = { git = "https://github.com/gnosisguild/fhe.rs.git", branch = "raw-bytes" }
serde_json = "1.0.133"
rand = "0.8.5"
bigint-poly = { git = "https://github.com/gnosisguild/bigint-poly", features = ["serde"] }
num-bigint = "0.4.6"
num-traits = "0.2"
num-integer = "0.1"
ndarray = "0.15.6"
itertools = "0.14.0"
rayon = "1.10.0"
blake3 = "1.8.2"
tempfile = "3.8"
chrono = { version = "0.4", features = ["serde"] }