[package]
name = "zkfhe-generator"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "CLI tool for generating zkFHE circuit parameters and Noir TOML files"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[[bin]]
name = "zkfhe-generator"
path = "src/main.rs"

[dependencies]
shared = { package = "zkfhe-shared", path = "../shared" }
greco = { package = "zkfhe-greco", path = "../circuits/greco" }
pk_trbfv = { package = "zkfhe-pk-trbfv", path = "../circuits/pk_trbfv" }
pk_agg_trbfv = { package = "zkfhe-pk-agg-trbfv", path = "../circuits/pk_agg_trbfv" }
dec_share_trbfv = { package = "zkfhe-dec-share-trbfv", path = "../circuits/dec_share_trbfv" }
dec_share_agg_trbfv = { package = "zkfhe-dec-share-agg-trbfv", path = "../circuits/dec_share_agg_trbfv" }
dec_bfv = { package = "zkfhe-dec-bfv", path = "../circuits/dec_bfv" }
dec_bfv_no_hom_add = { package = "zkfhe-dec-bfv-no-hom-add", path = "../circuits/dec_bfv_no_hom_add" }
verify_shares_trbfv = { package = "zkfhe-verify-shares-trbfv", path = "../circuits/verify_shares_trbfv" }
crypto_params = { package = "zkfhe-crypto-params", path = "../crypto_params" }
fhe = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
num-bigint = { workspace = true }